[alias]
# Release, because the evals run the real engines.
xtask = "run --release --package xtask --features llama --"
# The meeting eval (ticket 16) also needs every other engine, which fetches sherpa-onnx.
xtask-meeting = "run --release --package xtask --features meeting --"

# llama.cpp finds any OpenSSL on the machine and links it by absolute path, for an HTTPS client
# nothing here calls. Without this the app depends on Homebrew at run time (ADR-0004: no network).
[env]
CMAKE_DISABLE_FIND_PACKAGE_OpenSSL = "TRUE"

# ADR-0003: llama.cpp is a shared library so its ggml stays apart from whisper.cpp's. Binaries
# look for it next to themselves.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,@executable_path"]

# An executable exports static symbols that a shared library also uses, so without
# --exclude-libs libllama binds to whisper.cpp's older ggml and aborts.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,--exclude-libs,ALL", "-C", "link-arg=-Wl,-rpath,$ORIGIN"]
