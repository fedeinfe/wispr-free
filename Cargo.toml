[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/fedeinfe/wispr-free"
publish = false

# Versions verified for ADR-0003 on 2026-10-30. Members opt in with `dep.workspace = true`;
# native engines stay out of member manifests until the ticket that uses them.
[workspace.dependencies]
# Internal crates
wf-core = { path = "crates/core" }
wf-audio = { path = "crates/audio" }
wf-pipeline = { path = "crates/pipeline" }
wf-platform = { path = "crates/platform" }
wf-models = { path = "crates/models" }
wf-meetings = { path = "crates/meetings" }

# UI
slint = "1.18.1"
slint-build = "1.18.1"

# Audio
cpal = "0.18.2"
rubato = "5.0.1"
nnnoiseless = "0.5.2"

# Inference (ADR-0003). GPU backends are features: whisper-rs/llama-cpp-2 `metal`, `cuda`, `vulkan`.
sherpa-onnx = "2.0.1"
whisper-rs = "0.16.0"
llama-cpp-2 = { version = "0.1.160", default-features = false }

# Storage
rusqlite = { version = "0.41.1", features = ["bundled"] }

# Common
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
directories = "6.0.0"

# Model downloads (ticket 11): blocking HTTPS client, SHA-256, hardware probe
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
