[package]
name = "wf-shell"
description = "The app's decisions, with no window toolkit and no engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `staticlib` is what the Swift app links (spec, Crates).
[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
wf-core = { workspace = true, features = ["uniffi"] }
wf-audio.workspace = true
wf-platform.workspace = true
wf-models.workspace = true
wf-meetings.workspace = true
wf-dictation.workspace = true
wf-history.workspace = true
mimalloc.workspace = true
directories.workspace = true
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
uniffi.workspace = true

[dev-dependencies]
tempfile.workspace = true
