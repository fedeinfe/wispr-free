[package]
name = "wf-meetings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# System-audio capture, the Opus/Ogg writer (15), live transcript and summary (16), and chat (17).
[dependencies]
wf-core.workspace = true
wf-audio.workspace = true
wf-pipeline.workspace = true
opus.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-audio.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
objc2-core-media = { workspace = true, features = ["CMBlockBuffer", "CMSampleBuffer", "CMTime", "objc2-core-audio-types"] }
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSUUID", "NSValue", "NSArray", "NSString", "NSError"] }
objc2-screen-capture-kit.workspace = true
block2.workspace = true
dispatch2.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cpal.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

# The PulseAudio client also serves PipeWire, through pipewire-pulse.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }

[dev-dependencies]
ogg.workspace = true
