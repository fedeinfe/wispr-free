# wispr-free model catalog (spec §6). Bundled into the binary; a newer copy can replace it
# without code changes. Bump `version` on every edit; bump `schema` only for breaking format
# changes.
#
# Every entry is a *candidate*: ticket 14 benchmarks them and sets the tier defaults.
# Sizes and SHA-256 come from the Hugging Face API (LFS metadata) at the pinned revisions,
# fetched 2026-10-30. `ram_mb` is an estimate (weights + runtime buffers) until ticket 14
# measures it.

schema = 1
version = "2026.10.30.2"

# Tier presets: stage toggles plus one model per enabled stage. A tier downloads exactly the
# models it names.

[tiers.lite]
denoise = false
vad = true
llm_cleanup = false
meeting_refine = false
diarization = false
vad_model = "silero-vad-v5"
asr_model = "whisper-small-q8_0"

[tiers.balanced]
denoise = false
vad = true
llm_cleanup = true
meeting_refine = true
diarization = true
vad_model = "silero-vad-v5"
asr_model = "parakeet-tdt-0.6b-v3-int8"
llm_model = "qwen3-1.7b-q4_k_m"
segmentation_model = "pyannote-segmentation-3.0-int8"
speaker_model = "eres2net-voxceleb"

[tiers.high]
denoise = false
vad = true
llm_cleanup = true
meeting_refine = true
diarization = true
vad_model = "silero-vad-v5"
asr_model = "whisper-large-v3-turbo"
llm_model = "qwen3-4b-instruct-2507-q4_k_m"
segmentation_model = "pyannote-segmentation-3.0-int8"
speaker_model = "eres2net-voxceleb"

