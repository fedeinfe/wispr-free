[package]
name = "wf-dictation"
description = "The dictation flow, from shortcut to inserted text. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wf-core.workspace = true
wf-audio.workspace = true
wf-pipeline.workspace = true
wf-platform.workspace = true
wf-models.workspace = true
wf-history.workspace = true
wf-meetings.workspace = true
serde.workspace = true
serde_json.workspace = true

# The real engines, for the process that hosts them. Everything else reaches them through
# `remote::ChildEngines` and links none of this.
[features]
engines = [
    "wf-pipeline/silero",
    "wf-pipeline/whisper",
    "wf-pipeline/sherpa",
    "wf-pipeline/diarization",
    "wf-pipeline/llama",
]

[dev-dependencies]
tempfile.workspace = true
