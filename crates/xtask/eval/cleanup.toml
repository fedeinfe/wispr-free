# Eval set for LLM cleanup, written for this project. `input` is what ASR hands over; the eval
# runs it through rule cleanup and LLM cleanup, the path a dictation takes.
#
# A case passes when the output matches one `expect` (ignoring case and punctuation, with a
# small word tolerance) and meets its checks: `contains`, `absent`, `list_items`, `lowercase`
# and `final_period`. Cases with `holdout = true` are kept out of prompt tuning.

# --- Self-corrections -------------------------------------------------------------------------

[[case]]
id = "sc-en-spec-example"
category = "self-correction"
language = "en"
input = "I like the red one, oh no, I meant the blue one"
expect = ["I like the blue one."]
absent = ["red"]

[[case]]
id = "sc-en-day"
category = "self-correction"
language = "en"
input = "let's meet on Tuesday, no wait, Wednesday at noon"
expect = ["Let's meet on Wednesday at noon."]
absent = ["Tuesday"]

[[case]]
id = "sc-en-person"
