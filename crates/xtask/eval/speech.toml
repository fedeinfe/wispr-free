[[passage]]
id = "it-racconto"
language = "it"
length = "long"
text = "Quando mia nonna era giovane lavorava in un piccolo forno vicino al porto, e si alzava molto prima del sole per accendere il fuoco. Mi raccontava che i pescatori tornavano dalle barche della notte, infreddoliti e affamati, e che lei teneva sempre un cesto di panini caldi vicino alla porta. Nessuno ha mai pagato quei panini, e nessuno le ha mai chiesto di smettere di regalarli. Molti anni dopo, quando il forno era in difficoltà e il padrone non riusciva a pagare i conti, gli stessi pescatori si presentarono una mattina con una colletta fatta lungo il molo. Non erano molti soldi, ma bastarono per tenere aperto durante un inverno difficile. Ha tenuto il vecchio cesto in cucina per tutta la vita, e sorrideva ogni volta che qualcuno le chiedeva perché non lo buttasse via."
