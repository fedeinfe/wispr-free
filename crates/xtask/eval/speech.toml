language = "en"
length = "long"
text = "When my grandmother was young she worked at a small bakery near the harbour, and she used to get up long before the sun to light the ovens. She told me that the fishermen would come in from the night boats, cold and hungry, and that she always kept a basket of warm rolls by the door for them. Nobody ever paid for those rolls, and nobody ever asked her to stop giving them away. Years later, when the bakery was in trouble and the owner could not pay his bills, those same fishermen turned up one morning with a collection they had made along the quay. It was not a great deal of money, but it kept the doors open through a hard winter. She kept the old basket in her kitchen for the rest of her life, and she would smile whenever anybody asked her why she did not throw it away."

