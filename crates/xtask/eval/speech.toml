# Passages with known text, for comparing ASR models (ticket 14). Written for this project.
# `cargo xtask-meeting speech-fixture` has macOS `say` read each one in every voice of its language.
# The audio stays out of git: Apple's license limits system voices (see tests/fixtures/README.md).
#
# Synthetic voices flatter every model, so read these numbers as a comparison between models, not
# as what a person at a microphone would get. There are no digits or spelled-out amounts here:
# models disagree on how to write them, and that would count as a word error when it isn't one.
#
# A `short` passage runs about 10 s, the length of the spec's latency target. A `long` one runs
# past Whisper's 30 s window. Each goes in clean and with noise added, because clean `say` audio
# leaves the models almost tied.

[voices]
en = ["Samantha", "Daniel"]
it = ["Alice", "Eddy (Italian (Italy))"]

# Recordings of real people in crates/pipeline/tests/fixtures. There are few and they are short.
# Their references come from what several models agreed on, checked against the book's title page
# for the translator's name, so they are less sure than the passages below.
