[package]
name = "xtask"
description = "Developer tasks, run with `cargo xtask`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
llama = ["wf-pipeline/llama"]
meeting = [
    "llama",
    "wf-pipeline/sherpa",
    "wf-pipeline/silero",
    "wf-pipeline/whisper",
    "wf-pipeline/diarization",
]

[dependencies]
wf-core.workspace = true
wf-meetings.workspace = true
wf-models.workspace = true
wf-pipeline.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Whisper needs this for the GPU, as in wf-dictation. Without it a High run measures the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
wf-pipeline = { workspace = true, features = ["metal"] }

[dev-dependencies]
tempfile.workspace = true
wf-dictation.workspace = true
